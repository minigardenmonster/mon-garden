<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สวนมอนจิ๋ว v0.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* VOICE: a handheld pet toy — cosy, playful, a little mischievous
   IDEA: a folding two-screen console: garden on top, care menu below
   PICTURE: the live pixel garden itself, 8x10 cells, filling the top screen
   COLOUR and TYPE: night-purple shell, cream panels, grass greens; Kanit + Silkscreen digits
   LAYOUT: one column device, max 420px, top screen / hinge / bottom screen + fixed menu */
:root{color-scheme:dark;--shell:#1d1830;--ink:#2b1d2f;--cream:#e9dcc0;--paper:#fffaf0;--hi:#ffe9a8;--org:#f29b38}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:#120e20;color:var(--ink);font:15px/1.45 Kanit,system-ui,sans-serif;overflow-x:clip}
#dev{max-width:420px;margin:0 auto;background:var(--shell);min-height:100vh;display:flex;flex-direction:column;padding:0 6px 8px}
#hdr{height:34px;display:flex;align-items:center;justify-content:space-between;color:#f4e9d0;font-size:13px;padding:0 6px}
.dig{font-family:Silkscreen,monospace}
#jar{position:relative;padding-top:16px}
#lid{position:absolute;left:50%;top:0;transform:translateX(-50%);width:46%;height:22px;background:linear-gradient(#c8935a,#9a6a3a);border:2px solid var(--ink);border-radius:6px 6px 3px 3px;box-shadow:inset 0 3px 0 #e0b07a,inset 0 -4px 0 #7a4a2a;z-index:2}
#lid::after{content:'';position:absolute;left:12%;right:12%;top:6px;height:2px;background:repeating-linear-gradient(90deg,#7a4a2a 0 3px,transparent 3px 8px)}
#top{position:relative;margin-top:10px;padding:6px;border:3px solid #2b1d2f;border-radius:46px 46px 22px 22px;background:linear-gradient(90deg,rgba(190,235,255,.45),rgba(150,210,240,.18) 30%,rgba(150,210,240,.12) 70%,rgba(190,235,255,.4));box-shadow:inset 0 0 0 4px rgba(220,245,255,.55),inset 0 0 0 6px rgba(43,29,47,.25)}
#cv{border-radius:38px 38px 0 0}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.tcard{border:3px solid #2b1d2f;border-radius:10px;padding:4px;box-shadow:3px 3px 0 #2b1d2f}
.tin{border-radius:6px;padding:5px;display:flex;flex-direction:column;gap:4px}
.tname{color:#fff;font-size:12px;text-shadow:-1px -1px 0 #2b1d2f,1px -1px 0 #2b1d2f,-1px 1px 0 #2b1d2f,1px 1px 0 #2b1d2f;white-space:nowrap;overflow:hidden}
.tart{border:2px solid #2b1d2f;height:72px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 6px,transparent 6px 18px)}
.ttag{background:#fffaf0;border:2px solid #2b1d2f;border-radius:4px;font-size:10px;text-align:center;color:#2b1d2f}
.tempty{border:3px dashed #8a7a9a;border-radius:10px;min-height:190px;display:flex;align-items:center;justify-content:center;color:#a898b8}
.tin-anim{animation:cardin 1s cubic-bezier(.3,1.5,.5,1) both}@keyframes cardin{0%{transform:scale(.2) rotateY(180deg);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.tin-anim{animation:none}}
.env.shake img{animation:envshake .18s linear infinite}@keyframes envshake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-3px)}100%{transform:rotate(-8deg)}}
.pop{display:inline-block;animation:envpop .5s cubic-bezier(.3,1.6,.5,1) both}@keyframes envpop{0%{transform:scale(.2) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.env.shake img,.pop{animation:none}}
#cv.paint{touch-action:none}
#soil{height:30px;border-radius:0 0 14px 14px;margin-top:-1px;background:
 linear-gradient(#3f8f36 0 4px,transparent 4px),
 radial-gradient(circle at 6px 15px,#9ea5b8 3px,transparent 4px) 0 0/16px 30px,
 radial-gradient(circle at 12px 19px,#cfd3e0 2px,transparent 3px) 0 0/22px 30px,
 linear-gradient(#5a3a22 4px,#6b4428 13px,#8a8070 13px,#7a7262 22px,#e0c890 22px,#d4b878 30px)}
.glare{position:absolute;pointer-events:none;border-radius:20px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));z-index:1}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#jar,#top{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#toast{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(43,29,47,.9);color:#fff6d6;font-size:13px;padding:4px 8px;border:2px solid #000;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#toast.on{opacity:1}
#hinge{height:10px;display:flex;justify-content:center;gap:120px;align-items:center}#hinge i{width:40px;height:4px;background:#2e2647}
#bot{background:var(--cream);border:2px solid var(--ink);padding:7px;display:flex;flex-direction:column;gap:7px;flex:1}
#panel{display:flex;flex-direction:column;gap:6px;min-height:190px}
#nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.nb{position:relative;height:52px;background:var(--paper);border:2px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(43,29,47,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:500;padding:0}
.nb.on{background:var(--hi);box-shadow:0 0 0 3px var(--org)}
.nb:focus-visible,.b:focus-visible,.card:focus-visible{outline:3px solid #5fc4ff;outline-offset:1px}
.badge{position:absolute;top:-6px;right:-4px;min-width:16px;height:16px;background:#e8473f;color:#fff;border:2px solid var(--ink);font:9px/12px Silkscreen,monospace;text-align:center}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
.row{display:flex;gap:6px;align-items:center}
.ros{display:flex;gap:6px;padding-top:4px}
.card{position:relative;flex:1;height:58px;background:var(--paper);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:3px;padding:2px}
.card.on{background:var(--hi);box-shadow:0 0 0 3px var(--org)}
.card .nm{font-size:11px;font-weight:600;line-height:1.1}
.box{background:var(--paper);border:2px solid var(--ink);padding:6px 8px}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 10px}
.bar{display:flex;align-items:center;gap:5px;font-size:11px}.bar span{width:38px;color:#4a3a50}
.bar div{flex:1;height:8px;background:var(--ink);border:2px solid var(--ink);box-sizing:content-box}.bar b{display:block;height:8px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:0 6px;border:2px solid var(--ink);color:#fff;line-height:1.5}
.tr{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:0 6px;border:2px solid #8b5cd6;background:var(--paper);line-height:1.5}
.tr.l{border-color:#2f7a33}
.b{height:40px;background:var(--paper);border:2px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(43,29,47,.18);font-size:13px;font-weight:600;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.b.y{background:var(--hi)}.b.g{background:#c8f0b8}.b.r{background:#ffd9cf}
.b:disabled{opacity:.45;cursor:default}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.it{position:relative;min-height:70px;background:var(--paper);border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;padding:3px;font-size:10px;font-weight:600;line-height:1.15;text-align:center}
.it.on{background:var(--hi);box-shadow:0 0 0 3px var(--org)}
.it .q{position:absolute;top:2px;right:4px;font:9px Silkscreen,monospace}
.st{font-size:9px;color:#f2a531;letter-spacing:-1px}.st i{color:#cfc3a8;font-style:normal}
.h{font-size:14px;font-weight:600}
.sm{font-size:11px;color:#4a3a50}
.meter{position:relative;height:26px;background:#d9cdb0;border:2px solid var(--ink);overflow:hidden}
.meter .z{position:absolute;top:0;bottom:0;background:#9ee05a}.meter .z2{position:absolute;top:0;bottom:0;background:#ffd84a}
.meter .k{position:absolute;top:-2px;bottom:-2px;width:6px;background:var(--ink)}
.dark{background:var(--ink);color:#f4e9d0;border:2px solid #8b5cd6;padding:5px 8px}
.hp{height:8px;background:#000;padding:2px;flex:1}.hp b{display:block;height:8px}
input.nm{font:inherit;font-size:16px;height:36px;border:2px solid var(--ink);padding:0 8px;flex:1;background:#fff}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

</div>

}

/* ---------- main tick ---------- */
let last=performance.now(), acc=0, saveT=0;
function tick(dt){
  if(VISIT){ visitTick(dt); return; }

  if(B&&!B.over){ for(const m of S.mons) moveM(m,dt); battleTick(); return; }
  ballTick(dt); sparTick(); fbtTick();
  // reassign food left on the ground by an interrupted eater
  for(const dr of (S.drops||[])){ if(S.mons.some(m=>m.act&&m.act.type==='eat'&&m.act.drop===dr.id)) continue;
    if(!S.lights) continue; const F=FOOD[dr.k]||{};
    const pool=S.mons.filter(m=>sp(m).st>0&&!m.held&&(!m.act||!['sleep','train','eat','fetch'].includes(m.act.type)));
    let c;
    if(dr.group){ const want=pool.filter(m=>F.cure?m.sick:F.snack?m.ha<92:m.hu<90); c=want.sort((a,b)=>F.cure?(b.crit||0)-(a.crit||0):F.snack?a.ha-b.ha:a.hu-b.hu)[0];
      if(c&&Math.random()<0.5){ for(const o of want) if(o!==c&&!o.em) emote(o,'dots',1.5); } }
    else c=pool.sort((a,b)=>Math.hypot(a.x-dr.c,a.y-dr.r)-Math.hypot(b.x-dr.c,b.y-dr.r))[0];
    if(c){const n=freeNear(dr.c,dr.r)||[dr.c,dr.r]; walkTo(c,...n); setAct(c,'eat',{drop:dr.id,dur:999}); if(dr.group) emote(c,'excl',1);} else if(!dr.group&&S.t-dr.t>60){S.drops=S.drops.filter(d=>d!==dr);} }

  for(const m of S.mons.filter(x=>x.dead)) bury(m);
  for(const m of S.mons){
    if(sp(m).st>0&&pretty.length&&!homeOf(m)){ let b=0; for(const i of pretty){ if(Math.hypot(i.c+.5-(m.x+.5),i.r+.5-(m.y+.5))<=1.8) b+=IT[i.k].s-2; } if(b){ m.ha=clamp(m.ha+dt*M().actK*0.12*b); if(Math.random()<dt*0.05*b&&!m.em) emote(m,'heart',1.5);} }

function moveM(m,dt){

  if(d.cardin){ cardStore(mon(+d.cardin)); return; }

  if(d.tab){ trainTab=d.tab; render(); return; }
  if(d.sparpick){ const id=+d.sparpick; if(sparSel.includes(id)) sparSel=sparSel.filter(x=>x!==id); else { sparSel.push(id); if(sparSel.length>2) sparSel.shift(); } render(); return; }
  if(d.sparstart){ if(!S.lights){toast('เปิดไฟก่อน'); return;} sparStart(); render(); return; }
  if(d.sparagain){ const ok=sparSel.every(id=>{const m=mon(id); return m&&!m.sick&&m.en>=20;}); SPAR=null; if(ok) sparStart(); else toast('พลังไม่พอซ้อมต่อ ให้พักก่อนนะ'); render(); return; }
  if(d.sparend){ SPAR=null; sparSel=[]; render(); return; }
  if(d.hyper){ const m=selM(); const h=m&&hyperReady(m); if(!h||!h.ok) return; S.special.hstone--; evolve(m,h.to); toast(`${m.name} ปลดพลังเป็นร่างไฮเปอร์!`); setPanel('status'); return; }
  if(d.env){ if(!ENV||ENV.stage) return; ENV.stage=1; sfx('tap'); render(); setTimeout(()=>{ if(ENV){ ENV.stage=2; sfx('envelope'); if(panel==='envelope') render(); } },900); return; }
  if(d.ball){ if(!S.lights){toast('เปิดไฟก่อน มอนกำลังนอน'); return;} ballAim=!ballAim; render(); return; }
  if(d.restore){restoreSave(d.restore); return;}
});
document.getElementById('bot').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='nmI'){const b=document.querySelector('[data-rn="ok"]'); if(b) b.click();} });

/* ---------- loop ---------- */
let uiT=0;
function frame(now){
  requestAnimationFrame(frame); try{ frameBody(now); }catch(e){ try{ console.error('frame',e); }catch(_){} }
}
function frameBody(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(!VISIT&&!S.__visit&&dt>0){ try{ if(document.visibilityState!=='hidden') S.prog=(S.prog||0)+dt; }catch(e){} }
  tick(dt); stepFX(dt); if(TO.length){const due=TO.filter(o=>S.t>=o.t); TO=TO.filter(o=>S.t<o.t); due.forEach(o=>o.f());}
  if(trainG&&!trainG.done){trainG.pos+=trainG.dir*trainG.spd*dt; if(trainG.pos>=100){trainG.pos=100;trainG.dir=-1;} if(trainG.pos<=0){trainG.pos=0;trainG.dir=1;} const n=document.getElementById('needle'); if(n) n.style.left=`calc(${trainG.pos}% - 3px)`;}
  draw();
  if(toastLater&&S.t>1){const f=toastLater; toastLater=null; f();}
  if(toastT>0){toastT-=dt; if(toastT<=0) document.getElementById('toast').classList.remove('on');}
  uiT+=dt; if(uiT>1&&['home','status'].includes(panel)&&!renameOpen){uiT=0; render();} else if(uiT>1){uiT=0; document.getElementById('nav').innerHTML=navHtml(); document.getElementById('coins').textContent=VISIT?VISIT.home.coins:S.coins;}
  saveT+=dt; if(saveT>5){saveT=0; save();} cloudT+=dt; if(cloudT>90){cloudT=0; cloudPush();}
  if(MODE==='real'){const d=new Date(); document.getElementById('tm').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; document.getElementById('clock').textContent=`วันที่ ${1+Math.floor((Date.now()-(S.born||Date.now()))/86400000)}`;}
  else {const h=hour(), mi=Math.floor(((S.t*SPEED/60)+360)%60); document.getElementById('tm').textContent=`${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`; document.getElementById('clock').textContent=`วันที่ ${1+Math.floor(((S.t*SPEED/60)+360)/1440)}`;}
}
// offline catch-up (light): age and needs for up to 3 minutes away
function catchUp(){
  awayLog=[]; awayInfo=null; if(!S.saved) return;
  const C=M(); const away=Math.min(C.offCap,Math.max(0,(Date.now()-S.saved)/1000)); if(away<5) return;
  const p0=S.poops.length; let apples=0; let left=away;
  while(left>0){ const st=Math.min(C.step,left); left-=st; S.t+=st; for(const m of S.mons) needs(m,st,true);
    if(S.t>=S.nextApple){S.nextApple=S.t+C.apple; const got=fruitHarvest(); apples+=Object.values(got).reduce((a,b)=>a+b,0);}
    for(const m of S.mons){ if(m.flags.poopAt&&S.t>=m.flags.poopAt){m.flags.poopAt=0; const n=randFree(); if(n) S.poops.push({id:uid++,c:n[0],r:n[1],t:S.t});} } }
  if(S.nextBattle<1e12&&S.nextBattle<S.t+30) S.nextBattle=S.t+Math.min(300,C.battleFirst);
  if(S.granny&&S.t>S.granny.until){S.granny=null;} if(!S.granny&&S.t>=S.nextGift) S.nextGift=S.t+10;
  if(S.lights) for(const m of S.mons){ if(m.act&&m.act.type==='sleep'&&m.en>=60){ m.act=null; m.em=null; } }
  awayInfo={sec:away,poops:S.poops.length-p0,apples};
  if(away<60&&!awayLog.length){toast(`ผ่านไป ${fmt(away)}`); awayInfo=null;}
}
catchUp();
ensureHomes();
if(awayInfo) panel='away';
if(S.gotStarter){delete S.gotStarter; setTimeout2(()=>{toast('ได้ชุดของแต่งสวนขวด! ไปที่ปุ่มตกแต่ง');});}
if(MIGRATED) (function(){const tt=document.getElementById('toast'); tt.textContent='กู้มอนสเตอร์จากเวอร์ชันก่อนกลับมาแล้ว'; tt.classList.add('on'); toastT=5;})();
render();
requestAnimationFrame(frame);
window.addEventListener('pagehide',save);
}
</script>
